name: Windows executable

# Builds Cicerone.exe on a GitHub Windows machine, so nobody needs Python
# installed: neither whoever develops the app nor whoever uses it.
#
# Start it by hand from the Actions tab ("Run workflow"), or push a v* tag to
# get a release with the executable attached as well.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Without this the GITHUB_TOKEN is read-only and creating the release fails
# with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the executable
        run: pyinstaller --clean --noconfirm Cicerone.spec

      - name: Check that it was produced
        run: |
          if (-not (Test-Path dist/Cicerone.exe)) { throw "executable not produced" }
          $mb = [math]::Round((Get-Item dist/Cicerone.exe).Length / 1MB, 1)
          Write-Host "Cicerone.exe ready, $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: Cicerone-windows
          path: dist/Cicerone.exe
          retention-days: 90

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cicerone.exe
